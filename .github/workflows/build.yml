name: Build

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
      - name: Rubocop
        run: rake rubocop
      - name: Unit tests
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: key_id
          AWS_SECRET_ACCESS_KEY: secret_key
        run: rake spec:unit
      - name: Integration tests
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: rake spec:integration
  publish:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Bundle
        id: bundle
        run: |
          gem build egis.gemspec --output=bundle.gem
          gem specification bundle.gem version --yaml | ruby -e "require 'yaml'; puts \"version=#{YAML.safe_load(ARGF, permitted_classes: [Gem::Version])}\"" >> "$GITHUB_OUTPUT"
          gem search --remote --exact egis | ruby -e "puts \"rubygems-version=#{/egis \((.+?)\)/.match(ARGF.read)[1]}\"" >> "$GITHUB_OUTPUT"
      - name: Print versions
        run: |
          echo "RubyGems version: ${{ steps.bundle.outputs.rubygems-version }}"
          echo "Build version: ${{ steps.bundle.outputs.version }}"
      - name: Push to RubyGems
        if: github.ref == 'refs/heads/master' && steps.bundle.outputs.version != steps.bundle.outputs.rubygems-version
        env:
          GEM_HOST_API_KEY: ${{ secrets.U2I_RUBY_GEMS_API_ACCESS_KEY }}
        run: gem push bundle.gem
